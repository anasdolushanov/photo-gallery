<div class="photo-page">
  @if (photo(); as p) {
    <div class="photo-viewer">
      <img [src]="p.url" alt="Favorite photo" />

      <div class="actions">
        <button matButton (click)="removeFromFavorites()">Remove from favorites</button>
      </div>
    </div>
  } @else {
    <p class="not-found">This photo is no longer in your favorites.</p>
  }
</div>
