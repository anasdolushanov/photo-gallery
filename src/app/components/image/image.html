<div class="image-container">
  @if (isLoading()) {
    <mat-spinner diameter="32" />
  }
  @if (hasError()) {
    <p class="error">Failed to load image</p>
  } @else {
    <img
      [src]="url()"
      alt="Random photo"
      [class.hidden]="isLoading()"
      (load)="onLoad()"
      (error)="onError()"
    />
  }
</div>
